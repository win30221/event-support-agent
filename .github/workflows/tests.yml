name: Python regression tests

on:
  pull_request:
  push:
    branches: [main, 'refactor/**', 'fix/**', 'research/**']

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_SUPPORT_AGENT_PG_DSN: postgresql://postgres:demo-test@127.0.0.1:5432/event_support_agent_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: event_support_agent_test
          POSTGRES_PASSWORD: demo-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_support_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python player_progress.py
      - name: Check evaluation module entry points
        run: |
          python -m evaluations.eval_intent --help
          python -m evaluations.eval_rag --help
          python -m evaluations.eval_answer --help
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m pip check
      - run: python -m evaluations.eval_rag
